# Этот файл говорит GitHub: "когда я пушу код — собери APK автоматически"
name: Собрать APK

# Когда запускать сборку
on:
  push:
    branches: [ main ]        # При каждом push в main
  workflow_dispatch:           # Или вручную нажав кнопку на GitHub

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest    # GitHub даёт бесплатный Linux-сервер

    steps:

      # 1. Скачиваем код из репозитория
      - name: Получить код
        uses: actions/checkout@v4

      # 2. Устанавливаем Java (нужна для Android)
      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Кешируем Gradle чтобы следующие сборки были быстрее
      - name: Кеш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      # 4. Даём права на запуск Gradle
      - name: Права на gradlew
        run: chmod +x WorkJournal/gradlew

      # 5. Собираем debug APK (не нужна подпись — можно сразу устанавливать)
      - name: Собрать APK
        run: |
          cd WorkJournal
          ./gradlew assembleDebug --no-daemon

      # 6. Узнаём версию из git для имени файла
      - name: Получить версию
        id: version
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # 7. Переименовываем APK красиво
      - name: Переименовать APK
        run: |
          mkdir -p artifacts
          cp WorkJournal/app/build/outputs/apk/debug/app-debug.apk \
             artifacts/WorkJournal-${{ steps.version.outputs.sha }}.apk

      # 8. Сохраняем APK как артефакт (можно скачать прямо со страницы Actions)
      - name: Сохранить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: WorkJournal-APK
          path: artifacts/WorkJournal-*.apk
          retention-days: 30    # Хранить 30 дней

      # 9. Создаём Release — красивая страница с кнопкой "Скачать"
      - name: Создать Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.version.outputs.sha }}
          name: "Журнал работ — сборка ${{ steps.version.outputs.sha }}"
          body: |
            ## Журнал ремонтных работ

            Автоматическая сборка от ${{ github.event.head_commit.timestamp }}

            ### Как установить на Android:
            1. Скачай файл ниже (`WorkJournal-....apk`)
            2. Открой файл на телефоне
            3. Разреши установку из неизвестных источников
            4. Готово!

            ### Что нового:
            ${{ github.event.head_commit.message }}
          files: artifacts/WorkJournal-*.apk
          draft: false
          prerelease: false
